<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="اختبار أسئلة متعدد الخيارات قابل للتخصيص">
<meta name="theme-color" content="#4f46e5">
<title>اختبار جديد</title>

<!-- الخطوط العربية الخمسة للأبيات -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Aref+Ruqaa:wght@400;700&family=Noto+Nastaliq+Urdu:wght@400;700&family=Reem+Kufi:wght@400;700&family=Scheherazade+New:wght@400;700&display=swap" rel="stylesheet">

<style>
:root {
    --primary: #4f46e5;
    --primary-2: #7c3aed;
    --primary-dark: #4338ca;
    --primary-soft: #eef2ff;
    --accent: #f59e0b;
    --accent-soft: #fffbeb;
    --telegram: #2aabee;
    --whatsapp: #25d366;
    --background: #eef1f8;
    --card: #ffffff;
    --text: #1e2433;
    --muted: #6b7280;
    --line: #e7e9f2;
    --success: #059669;
    --success-soft: #ecfdf5;
    --danger: #e11d48;
    --danger-soft: #fff1f2;
    --radius: 20px;
    --radius-sm: 14px;
    --shadow: 0 14px 38px -16px rgba(30, 36, 51, .28);
    --shadow-sm: 0 6px 18px -10px rgba(30, 36, 51, .25);
    --ring: 0 0 0 4px rgba(79, 70, 229, .14);
    --font-body: "Segoe UI", Tahoma, "Noto Sans Arabic", "Noto Kufi Arabic", "Dubai", Geneva, Arial, sans-serif;

    /* ====== خط الأبيات ====== */
    --font-quote: "Aref Ruqaa", "Amiri", "Traditional Arabic", serif;
    --quote-lh: 2.35;
    --quote-scale: 1;

    /* ====== معامل تكبير/تصغير الخط العام ====== */
    --fs-scale: 1;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; }

body {
    font-family: var(--font-body);
    background: var(--background);
    color: var(--text);
    line-height: 1.7;
    min-height: 100vh;
    min-height: 100dvh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
}

.bg-decor { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
.bg-decor::before, .bg-decor::after {
    content: ""; position: absolute; border-radius: 50%; filter: blur(70px); opacity: .35;
}
.bg-decor::before { width: 460px; height: 460px; background: radial-gradient(circle, #818cf8, transparent 70%); top: -160px; right: -120px; }
.bg-decor::after { width: 420px; height: 420px; background: radial-gradient(circle, #c4b5fd, transparent 70%); bottom: -160px; left: -120px; }

#app { width: 100%; max-width: 820px; margin: 0 auto; padding: clamp(14px, 3vw, 32px); padding-bottom: clamp(40px, 6vw, 70px); }
#app.is-result { max-width: 1040px; }

.screen { animation: screenIn .45s cubic-bezier(.22, 1, .36, 1) both; }
@keyframes screenIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
.screen.pop .card { animation: cardPop .4s cubic-bezier(.22, 1, .36, 1) both; }
@keyframes cardPop { from { opacity: 0; transform: scale(.97) translateY(10px); } to { opacity: 1; transform: scale(1) translateY(0); } }

.card {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: clamp(18px, 4vw, 34px);
}

.quiz-topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.topbar-actions { display: flex; align-items: center; gap: 8px; }

.brand-pill {
    display: inline-flex; align-items: center; gap: 8px; background: rgba(255,255,255,.85);
    border: 1px solid var(--line); color: var(--primary-dark); font-weight: 700; font-size: .95rem;
    padding: 8px 16px; border-radius: 999px; box-shadow: var(--shadow-sm); backdrop-filter: blur(6px);
}
.brand-pill .dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: linear-gradient(135deg, var(--primary), var(--primary-2)); box-shadow: 0 0 0 4px var(--primary-soft);
}

.icon-btn {
    width: 42px; height: 42px; display: inline-flex; align-items: center; justify-content: center;
    border-radius: 12px; border: 1px solid var(--line); background: #fff; color: var(--muted);
    font-size: 1.15rem; cursor: pointer; transition: .2s; box-shadow: var(--shadow-sm);
}
.icon-btn:hover { color: var(--danger); border-color: var(--danger); transform: translateY(-1px); }
.icon-btn:active { transform: scale(.95); }

/* ===== أزرار حجم الخط ===== */
.fs-controls {
    display: inline-flex; align-items: center; gap: 5px; background: #fff; border: 1px solid var(--line);
    border-radius: 999px; padding: 4px 7px; box-shadow: var(--shadow-sm);
}
.fs-btn {
    width: 34px; height: 34px; border: 0; border-radius: 50%; background: var(--primary-soft);
    color: var(--primary-dark); font-family: inherit; font-weight: 900; font-size: .95rem; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; transition: .18s; line-height: 1;
}
.fs-btn:hover { background: var(--primary); color: #fff; }
.fs-btn:active { transform: scale(.92); }
.fs-value {
    font-size: .76rem; font-weight: 800; color: var(--muted); min-width: 40px; text-align: center;
    user-select: none; border: 0; background: transparent; cursor: pointer; font-family: inherit;
}
.fs-row { display: flex; justify-content: center; margin-bottom: 14px; }

/* ===== شريط اختيار خط الأبيات ===== */
.font-picker {
    position: relative; z-index: 1;
    display: flex; flex-wrap: wrap; justify-content: center; gap: 6px;
    margin: 0 0 14px;
}
.font-chip {
    border: 1.5px solid #ecd9a6; background: rgba(255,255,255,.8); color: #7a5410;
    border-radius: 999px; padding: 5px 13px; font-size: .95rem; font-weight: 700;
    cursor: pointer; transition: .18s; line-height: 1.5; white-space: nowrap;
}
.font-chip:hover { background: #fff3cf; border-color: #e0bd63; transform: translateY(-1px); }
.font-chip.active {
    background: linear-gradient(135deg, #d9a01d, #b97a0a); color: #fff; border-color: transparent;
    box-shadow: 0 8px 18px -10px rgba(146, 94, 16, .7);
}
.font-picker-label {
    width: 100%; text-align: center; font-size: .72rem; font-weight: 800; color: #a3803a;
    letter-spacing: .5px; margin-bottom: 2px;
}

.hero { text-align: center; }
.hero-badge {
    width: 88px; height: 88px; margin: 6px auto 18px; border-radius: 26px; display: flex; align-items: center;
    justify-content: center; font-size: 2.6rem; background: linear-gradient(135deg, var(--primary), var(--primary-2));
    color: #fff; box-shadow: 0 18px 34px -14px rgba(79, 70, 229, .65); transform: rotate(-3deg);
}
.hero h1 {
    font-size: clamp(1.9rem, 6vw, 2.8rem); margin: 4px 0 8px; font-weight: 800; letter-spacing: -.5px;
    background: linear-gradient(135deg, var(--primary-dark), var(--primary-2));
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
}
.hero .subtitle { font-size: clamp(1.05rem, 3.4vw, 1.3rem); font-weight: 700; color: var(--text); margin: 0 0 10px; }
.hero .desc { color: var(--muted); max-width: 560px; margin: 0 auto 22px; font-size: 1rem; }
.hero-meta { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-bottom: 24px; }
.meta-chip {
    display: inline-flex; align-items: center; gap: 7px; background: var(--primary-soft); color: var(--primary-dark);
    font-weight: 700; font-size: .9rem; padding: 8px 15px; border-radius: 999px; border: 1px solid #e0e7ff;
}
.best-chip { background: var(--accent-soft); color: #92400e; border-color: #fde68a; }

.btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 9px; width: 100%; min-height: 54px;
    padding: 14px 22px; border-radius: var(--radius-sm); border: 2px solid transparent; font-family: inherit;
    font-size: 1.08rem; font-weight: 800; cursor: pointer;
    transition: transform .18s, box-shadow .18s, background .18s, border-color .18s, opacity .18s;
    text-decoration: none; line-height: 1.3;
}
.btn:focus-visible { outline: none; box-shadow: var(--ring); }
.btn:active { transform: scale(.98); }
.btn-primary { background: linear-gradient(135deg, var(--primary), var(--primary-2)); color: #fff; box-shadow: 0 14px 26px -12px rgba(79, 70, 229, .7); }
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 18px 32px -12px rgba(79, 70, 229, .8); }
.btn-outline { background: #fff; color: var(--primary-dark); border-color: #c7d2fe; }
.btn-outline:hover { background: var(--primary-soft); transform: translateY(-2px); }
.btn-ghost { background: #f8fafc; color: var(--text); border-color: var(--line); }
.btn-ghost:hover { background: #f1f5f9; transform: translateY(-2px); }
.btn-telegram { background: var(--telegram); color: #fff; box-shadow: 0 12px 24px -12px rgba(42,171,238,.8); }
.btn-telegram:hover { transform: translateY(-2px); filter: brightness(1.05); }
.btn-whatsapp { background: var(--whatsapp); color: #fff; }
.btn-whatsapp:hover { transform: translateY(-2px); filter: brightness(1.04); }
.btn-success { background: var(--success); color: #fff; }
.btn[disabled] { opacity: .55; pointer-events: none; }
.btn-stack { display: flex; flex-direction: column; gap: 12px; }
.btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 480px) { .btn-row { grid-template-columns: 1fr; } }

.start-footer { margin-top: 26px; text-align: center; }
.start-footer a { color: var(--muted); font-size: .92rem; text-decoration: none; font-weight: 600; }
.start-footer a:hover { color: var(--telegram); }

.progress-card { margin-bottom: 16px; }
.progress-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; font-weight: 800; font-size: .98rem; }
.progress-head .pct { color: var(--primary); font-size: .95rem; }
.progress-track { height: 12px; background: #e9ecf5; border-radius: 999px; overflow: hidden; }
.progress-fill {
    height: 100%; width: 0; border-radius: 999px;
    background: linear-gradient(90deg, var(--primary), var(--primary-2), #a855f7); background-size: 200% 100%;
    transition: width .55s cubic-bezier(.22, 1, .36, 1); animation: shimmer 2.4s linear infinite;
}
@keyframes shimmer { to { background-position: -200% 0; } }

/* ==== بطاقة البيت الشعري ==== */
.quote-card {
    position: relative; margin: 4px 0 22px; padding: clamp(22px, 5vw, 34px) clamp(16px, 5vw, 36px);
    border-radius: var(--radius);
    background: radial-gradient(120% 140% at 100% 0, #fff7e0 0%, transparent 55%), linear-gradient(160deg, #fffdf6 0%, #fdf3dd 100%);
    border: 1.5px solid #f3e2b3; box-shadow: inset 0 1px 0 #fff, 0 12px 28px -16px rgba(146, 94, 16, .35);
    text-align: center; overflow: hidden;
}
.quote-card::before {
    content: "\275D"; position: absolute; top: -18px; right: 8px; font-size: 7rem; line-height: 1;
    color: rgba(217, 160, 29, .18); font-family: serif; pointer-events: none;
}
.quote-chip {
    display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,.75); border: 1px solid #f0ddaa;
    color: #92610c; font-size: .78rem; font-weight: 800; padding: 4px 13px; border-radius: 999px; margin-bottom: 12px;
}
.quote-text {
    position: relative;
    font-family: var(--font-quote);
    font-size: calc(clamp(1.4rem, 5.2vw, 1.9rem) * var(--fs-scale) * var(--quote-scale));
    line-height: var(--quote-lh);
    font-weight: 700; color: #4a3410; white-space: pre-line; overflow-wrap: break-word; margin: 0;
    transition: font-size .2s;
}

.question-text {
    font-size: calc(clamp(1.12rem, 3.8vw, 1.32rem) * var(--fs-scale)); font-weight: 800; line-height: 1.75;
    min-height: 62px; margin: 0 0 18px; overflow-wrap: break-word;
}

.options { display: flex; flex-direction: column; gap: 12px; margin-bottom: 8px; }
.option {
    display: flex; align-items: center; gap: 13px; width: 100%; min-height: 62px; padding: 13px 16px; background: #fff;
    border: 2px solid var(--line); border-radius: var(--radius-sm); font-family: inherit;
    font-size: calc(clamp(1rem, 3.4vw, 1.08rem) * var(--fs-scale)); font-weight: 600; color: var(--text); text-align: right;
    cursor: pointer; transition: border-color .18s, background .18s, transform .15s, box-shadow .18s; line-height: 1.55; overflow-wrap: break-word;
}
.option:hover { border-color: #b9c2f5; background: #fafbff; transform: translateY(-2px); box-shadow: var(--shadow-sm); }
.option:active { transform: scale(.99); }
.option:focus-visible { outline: none; box-shadow: var(--ring); }
.option .badge {
    flex: 0 0 auto; width: 40px; height: 40px; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center;
    background: #f1f3fa; color: var(--muted); font-weight: 800; font-size: 1.05rem; transition: .18s;
}
.option .option-text { flex: 1 1 auto; }
.option .tick {
    flex: 0 0 auto; width: 26px; height: 26px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center;
    background: #eef0f6; color: transparent; font-size: .85rem; font-weight: 900; transition: .18s;
}
.option.selected { border-color: var(--primary); background: var(--primary-soft); box-shadow: 0 10px 22px -14px rgba(79, 70, 229, .65); }
.option.selected .badge { background: linear-gradient(135deg, var(--primary), var(--primary-2)); color: #fff; }
.option.selected .tick { background: var(--primary); color: #fff; }
.option.feedback-correct { border-color: var(--success); background: var(--success-soft); }
.option.feedback-wrong { border-color: var(--danger); background: var(--danger-soft); }
.answer-feedback { margin-top: 12px; padding: 12px 16px; border-radius: 12px; font-weight: 800; text-align:center; }
.answer-feedback.correct { background: var(--success-soft); color: #065f46; border:1px solid #a7f3d0; }
.answer-feedback.wrong { background: var(--danger-soft); color: #9f1239; border:1px solid #fecdd3; }

.next-wrap { margin-top: 20px; min-height: 54px; }
.next-btn { opacity: 0; transform: translateY(10px) scale(.98); pointer-events: none; }
.next-btn.ready { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; animation: popIn .35s cubic-bezier(.22, 1.4, .4, 1) both; }
@keyframes popIn { from { opacity: 0; transform: translateY(12px) scale(.96); } to { opacity: 1; transform: translateY(0) scale(1); } }
.key-hint { text-align: center; color: var(--muted); font-size: .8rem; margin-top: 10px; }

.ad-block { margin-top: 26px; }
.ad-label { display: block; text-align: center; color: #a0a6b5; font-size: .72rem; font-weight: 700; letter-spacing: 1.5px; margin-bottom: 8px; }
.ad-slot {
    display: flex; justify-content: center; align-items: flex-start; width: 100%; max-width: 100%; margin: 0 auto; border-radius: var(--radius-sm);
    background: linear-gradient(90deg, rgba(241,243,250,.6) 25%, rgba(233,236,245,.9) 37%, rgba(241,243,250,.6) 63%);
    background-size: 400% 100%; animation: adShimmer 1.6s ease-in-out infinite; overflow: hidden;
}
@keyframes adShimmer { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }
.ad-frame { flex: 0 0 auto; overflow: hidden; line-height: 0; }
.ad-frame iframe { border: 0; display: block; background: transparent; overflow: hidden; }
.ad-disclaimer { display: block; text-align: center; color: #9aa0af; font-size: .72rem; line-height: 1.6; margin-top: 8px; max-width: 480px; margin-left: auto; margin-right: auto; }

.result-layout { display: grid; grid-template-columns: 1fr; gap: 22px; align-items: start; }
@media (min-width: 900px) {
    .result-layout { grid-template-columns: minmax(0, 1fr) 190px; }
    .result-aside { position: sticky; top: 24px; }
}
.result-hero { text-align: center; }
.result-emoji { font-size: 3rem; margin-bottom: 4px; animation: bob 2.2s ease-in-out infinite; }
@keyframes bob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-7px) } }
.result-title { font-size: 1.5rem; font-weight: 800; margin: 0 0 4px; }
.score-ring-wrap { position: relative; width: 190px; height: 190px; margin: 14px auto 8px; }
.score-ring-wrap svg { transform: rotate(-90deg); width: 100%; height: 100%; }
.ring-bg { fill: none; stroke: #eceef5; stroke-width: 14; }
.ring-fg { fill: none; stroke-width: 14; stroke-linecap: round; stroke-dasharray: 440; stroke-dashoffset: 440; transition: stroke-dashoffset 1.1s cubic-bezier(.22,1,.36,1), stroke .4s; }
.ring-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.ring-pct { font-size: 2.1rem; font-weight: 900; line-height: 1; }
.ring-pct-sub { font-size: .82rem; color: var(--muted); font-weight: 700; margin-top: 3px; }
.score-line { font-size: 1.25rem; font-weight: 800; margin: 6px 0 2px; }
.score-line .den { color: var(--muted); }
.result-msg { display: inline-block; margin: 12px auto 0; padding: 12px 20px; border-radius: 14px; font-weight: 700; max-width: 560px; }
.result-msg.lv-excellent { background: var(--success-soft); color: #065f46; border: 1px solid #a7f3d0; }
.result-msg.lv-great { background: var(--primary-soft); color: var(--primary-dark); border: 1px solid #c7d2fe; }
.result-msg.lv-good { background: var(--accent-soft); color: #92400e; border: 1px solid #fde68a; }
.result-msg.lv-low { background: var(--danger-soft); color: #9f1239; border: 1px solid #fecdd3; }
.compare-text { text-align: center; color: var(--muted); font-weight: 600; margin: 14px auto 4px; max-width: 560px; }
.stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 22px 0; }
.stat { background: #f8fafc; border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 13px 8px; text-align: center; }
.stat .num { font-size: 1.45rem; font-weight: 900; line-height: 1.2; }
.stat .lbl { font-size: .8rem; color: var(--muted); font-weight: 700; }
.stat.ok .num { color: var(--success); }
.stat.bad .num { color: var(--danger); }
.stat.pct .num { color: var(--primary); }
.share-menu {
    margin-top: 12px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: #f8fafc; padding: 12px;
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px; animation: popIn .3s cubic-bezier(.22,1.4,.4,1) both;
}
.share-menu .btn { min-height: 48px; font-size: .95rem; padding: 10px 12px; }
.hidden { display: none !important; }
.result-aside .ad-label { margin-top: 0; }
.result-aside .ad-slot { border-radius: var(--radius-sm); }
.result-footer { margin-top: 22px; border-top: 1px dashed var(--line); padding-top: 18px; }
.link-row { display: flex; gap: 8px; align-items: stretch; background: #f8fafc; border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 8px; margin: 8px 0 14px; }
.link-row input { flex: 1 1 auto; min-width: 0; border: 0; background: transparent; font-family: inherit; font-size: .85rem; color: var(--muted); padding: 0 10px; direction: ltr; text-align: left; }
.link-row input:focus { outline: none; }
.copy-btn { flex: 0 0 auto; border: 0; border-radius: 10px; background: var(--primary); color: #fff; font-family: inherit; font-weight: 800; font-size: .85rem; padding: 10px 16px; cursor: pointer; transition: .18s; min-height: 42px; }
.copy-btn:hover { filter: brightness(1.08); }
.copy-btn.copied { background: var(--success); }
.footer-links { display: flex; flex-direction: column; gap: 10px; }

.toast {
    position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%) translateY(90px); background: #1f2937; color: #fff;
    padding: 13px 24px; border-radius: 999px; font-weight: 700; font-size: .95rem; box-shadow: 0 16px 34px -12px rgba(0,0,0,.5);
    z-index: 999; transition: transform .35s cubic-bezier(.22,1.4,.4,1); max-width: calc(100vw - 40px); text-align: center;
}
.toast.show { transform: translateX(-50%) translateY(0); }

.error-card { text-align: center; }
.error-card .big { font-size: 2.6rem; margin-bottom: 8px; }
.error-card code { display: block; background: #f8fafc; border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-top: 12px; color: var(--danger); direction: ltr; text-align: left; font-size: .85rem; white-space: pre-wrap; }

/* ========================= مراجعة الإجابات ========================= */
.review-section { margin-top: 18px; border-top: 1px dashed var(--line); padding-top: 18px; }
.review-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.review-head h3 { margin: 0; font-size: 1.15rem; font-weight: 800; }
.review-item { border: 1.5px solid var(--line); border-radius: var(--radius-sm); padding: 16px; margin-bottom: 14px; background: #fff; text-align: right; }
.review-item.correct { border-color: #a7f3d0; background: var(--success-soft); }
.review-item.wrong { border-color: #fecdd3; background: var(--danger-soft); }
.review-q-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; font-weight: 800; font-size: .92rem; color: var(--muted); }
.review-status { font-size: .78rem; font-weight: 800; padding: 4px 12px; border-radius: 999px; white-space: nowrap; }
.review-status.ok { background: var(--success); color: #fff; }
.review-status.bad { background: var(--danger); color: #fff; }
.review-quote-text {
    font-family: var(--font-quote);
    font-size: calc(1.15rem * var(--fs-scale) * var(--quote-scale));
    line-height: var(--quote-lh);

const $app = document.getElementById("app");
const $toast = document.getElementById("toast");

function el(tag, className, html) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (html !== undefined) node.innerHTML = html;
    return node;
}

function tpl(str, map) {
    return str.replace(/\{(\w+)\}/g, (_, key) => (map[key] !== undefined ? map[key] : ""));
}

let toastTimer = null;

function showToast(message) {
    $toast.textContent = message;
    $toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => $toast.classList.remove("show"), 2200);
}

function copyText(text, doneMessage) {
    const fallback = () => {
        const ta = document.createElement("textarea");
        ta.value = text;
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.select();
        try {
            document.execCommand("copy");
            showToast(doneMessage || CONFIG.texts.copiedMessage);
        } catch (e) {
            showToast("تعذّر النسخ");
        }
        document.body.removeChild(ta);
    };

    if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text)
            .then(() => showToast(doneMessage || CONFIG.texts.copiedMessage))
            .catch(fallback);
    } else {
        fallback();
    }
}

function hashString(str) {
    let h = 0;
    for (let i = 0; i < str.length; i++) h = ((h << 5) - h + str.charCodeAt(i)) | 0;
    return Math.abs(h);
}

const QUIZ_SLUG = hashString(CONFIG.title);
const STORAGE_KEY = "mcqstate_v" + CONFIG.quizVersion + "_" + QUIZ_SLUG;
const BEST_KEY = "mcqbest_v" + CONFIG.quizVersion + "_" + QUIZ_SLUG;
const FS_KEY = "mcqfontscale";
const QF_KEY = "mcqquotefont";

(function cleanOldVersions() {
    try {
        const toRemove = [];
        for (let i = 0; i < localStorage.length; i++) {
            const k = localStorage.key(i);
            if (k && k.indexOf("mcqstate_") === 0 && k !== STORAGE_KEY) toRemove.push(k);
        }
        toRemove.forEach(k => localStorage.removeItem(k));
    } catch (e) {}
})();

function saveProgress(state) {
    try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
            version: CONFIG.quizVersion,
            title: CONFIG.title,
            index: state.index,
            answers: state.answers,
            savedAt: Date.now()
        }));
    } catch (e) {}
}

function loadProgress() {
    try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return null;
        const data = JSON.parse(raw);
        if (!data || data.version !== CONFIG.quizVersion || data.title !== CONFIG.title) return null;
        if (!Array.isArray(data.answers)) return null;
        if (typeof data.index !== "number" || data.index < 0 || data.index > QUESTIONS.length) return null;
        return data;
    } catch (e) { return null; }
}

function clearProgress() {
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
}

function loadBest() {
    try {
        const raw = localStorage.getItem(BEST_KEY);
        return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
}

function saveBest(score, total, percent) {
    try {
        const prev = loadBest();
        if (!prev || percent > prev.percent) {
            localStorage.setItem(BEST_KEY, JSON.stringify({ score, total, percent, date: Date.now() }));
        }
    } catch (e) {}
}

const FS_MIN = 0.80;
const FS_MAX = 1.80;
const FS_STEP = 0.10;

let fontScale = 1;

function loadFontScale() {
    try {
        const v = parseFloat(localStorage.getItem(FS_KEY));
        if (!isNaN(v) && v >= FS_MIN && v <= FS_MAX) fontScale = v;
    } catch (e) {}
}

function applyFontScale() {
    document.documentElement.style.setProperty("--fs-scale", String(fontScale));
    document.querySelectorAll(".fs-value").forEach(n => {
        n.textContent = Math.round(fontScale * 100) + "%";
    });
}

function changeFontScale(delta) {
    let next = Math.round((fontScale + delta) * 100) / 100;
    if (next < FS_MIN) next = FS_MIN;
    if (next > FS_MAX) next = FS_MAX;
    if (next === fontScale) return;
    fontScale = next;
    try { localStorage.setItem(FS_KEY, String(fontScale)); } catch (e) {}
    applyFontScale();
    showToast(CONFIG.texts.fontSizeToast + ": " + Math.round(fontScale * 100) + "%");
}

function resetFontScale() {
    fontScale = 1;
    try { localStorage.setItem(FS_KEY, "1"); } catch (e) {}
    applyFontScale();
    showToast(CONFIG.texts.fontSizeToast + ": 100%");
}

function buildFontControls() {
    const wrap = el("div", "fs-controls");

    const dec = el("button", "fs-btn", "A−");
    dec.type = "button";
    dec.setAttribute("aria-label", CONFIG.texts.fontSmaller);
    dec.title = CONFIG.texts.fontSmaller;
    dec.addEventListener("click", () => changeFontScale(-FS_STEP));

    const val = el("button", "fs-value", Math.round(fontScale * 100) + "%");
    val.type = "button";
    val.title = "إعادة الحجم الافتراضي";
    val.addEventListener("click", resetFontScale);

    const inc = el("button", "fs-btn", "A+");
    inc.type = "button";
    inc.setAttribute("aria-label", CONFIG.texts.fontBigger);
    inc.title = CONFIG.texts.fontBigger;
    inc.addEventListener("click", () => changeFontScale(FS_STEP));

    wrap.appendChild(dec);
    wrap.appendChild(val);
    wrap.appendChild(inc);
    return wrap;
}

let currentFontId = DEFAULT_FONT_ID;

function getFontById(id) {

function loadQuoteFont() {

function applyQuoteFont() {

function setQuoteFont(id, silent) {

function buildFontPicker() {
    const wrap = el("div", "font-picker");

    wrap.appendChild(el("span", "font-picker-label", CONFIG.texts.fontPickerLabel));

function validateQuestions(list) {
    const errors = [];
    const need = CONFIG.optionsCount || 4;

    if (!Array.isArray(list)) {
        errors.push("مصفوفة QUESTIONS غير صحيحة.");
        return { valid: false, errors, questions: [] };
    }

    if (list.length === 0) {
        return { valid: true, errors: [], questions: [] };
    }

    const clean = [];

    list.forEach((q, i) => {
        const where = "السؤال رقم " + (i + 1);

        if (!q || typeof q.question !== "string" || !q.question.trim()) {
            errors.push(where + ": نص السؤال مفقود."); return;
        }
        if (!Array.isArray(q.options) || q.options.length !== need) {
            errors.push(where + ": يجب أن يحتوي على " + need + " خيارات بالضبط."); return;
        }
        if (q.options.some(o => typeof o !== "string" || !o.trim())) {
            errors.push(where + ": يوجد خيار فارغ."); return;
        }
        if (!Number.isInteger(q.correct) || q.correct < 0 || q.correct >= need) {
            errors.push(where + ": قيمة correct غير صحيحة."); return;
        }

        clean.push({
            quote: typeof q.quote === "string" ? q.quote.trim() : "",
            question: q.question.trim(),
            options: q.options.map(o => String(o)),
            correct: q.correct
        });
    });

    return { valid: errors.length === 0, errors, questions: clean };
}

function parseAdCode(code) {
    const key = (code.match(/'key'\s*:\s*'([^']+)'/) || [])[1] || "ad";
    const width = parseInt((code.match(/'width'\s*:\s*(\d+)/) || [])[1], 10) || 320;
    const height = parseInt((code.match(/'height'\s*:\s*(\d+)/) || [])[1], 10) || 250;
    return { key, width, height, code };
}

const VALID_QUESTION_ADS = QUESTION_ADS.filter(c => c && c.trim());

function getAdForQuestion(questionIndex) {
    const n = VALID_QUESTION_ADS.length;
    if (n === 0) return null;
    return VALID_QUESTION_ADS[questionIndex % n];
}

function buildAdFrame(adCode) {
    const info = parseAdCode(adCode);

    const doc =
        '<!DOCTYPE html><html><head><meta charset="utf-8">' +
        '<meta name="viewport" content="width=device-width, initial-scale=1">' +
        '<style>*{box-sizing:border-box}html,body{margin:0;padding:0;background:transparent;}' +
        'body{display:flex;justify-content:center;align-items:flex-start;min-height:100%;overflow:hidden;}' +
        'iframe{max-width:100% !important;}</style></head><body>' + adCode + '</body></html>';

    const iframe = document.createElement("iframe");
    iframe.setAttribute("title", CONFIG.texts.adLabel);
    iframe.setAttribute("scrolling", "no");
    iframe.setAttribute("loading", "lazy");
    iframe.style.width = info.width + "px";
    iframe.style.height = info.height + "px";
    iframe.style.transformOrigin = "top center";
    iframe.srcdoc = doc;

    const wrapper = el("div", "ad-frame");
    wrapper.style.width = info.width + "px";
    wrapper.style.height = info.height + "px";
    wrapper.appendChild(iframe);

    const fit = () => {
        const slot = wrapper.parentElement;
        if (!slot) return;
        const available = slot.clientWidth;
        const scale = available >= info.width ? 1 : available / info.width;
        wrapper.style.width = info.width * scale + "px";
        wrapper.style.height = info.height * scale + "px";
        iframe.style.transform = "scale(" + scale + ")";
    };

    requestAnimationFrame(fit);

    if (typeof ResizeObserver !== "undefined") {
        const ro = new ResizeObserver(fit);
        setTimeout(() => { const slot = wrapper.parentElement; if (slot) ro.observe(slot); }, 0);
    }

    window.addEventListener("resize", fit);

    return { wrapper, width: info.width, height: info.height };
}

function mountAd(slot, adCode) {
    slot.innerHTML = "";
    if (!adCode) { slot.style.display = "none"; return; }
    slot.style.display = "flex";
    const built = buildAdFrame(adCode);
    slot.style.minHeight = built.height + "px";
    slot.appendChild(built.wrapper);
}

function buildAdBlock(adCode, extraClass) {
    const adBlock = el("div", "ad-block" + (extraClass ? " " + extraClass : ""));
    adBlock.appendChild(el("span", "ad-label", "— " + CONFIG.texts.adLabel + " —"));
    const slot = el("div", "ad-slot");
    adBlock.appendChild(slot);
    if (CONFIG.texts.adDisclaimer && CONFIG.texts.adDisclaimer.trim()) {
        adBlock.appendChild(el("span", "ad-disclaimer", CONFIG.texts.adDisclaimer));
    }
    setTimeout(() => mountAd(slot, adCode), 120);
    return adBlock;
}

function getStreakFromAnswers(answers) {
    let streak = 0, max = 0;
    (answers || []).forEach((a, i) => {
        if (typeof a !== "number") return;
        if (a === QUIZ[i].correct) { streak++; max = Math.max(max, streak); }
        else streak = 0;
    });
    return { streak, maxStreak: max };
}

function startQuiz(resume) {
    const saved = resume ? loadProgress() : null;
    clearProgress();
    state.index = saved ? saved.answers.length : 0;
    state.answers = saved ? saved.answers.slice(0, saved.answers.length) : [];
    const streakData = getStreakFromAnswers(state.answers);
    state.streak = streakData.streak;
    state.maxStreak = streakData.maxStreak;
    state.locked = false;
    renderQuestion();
}

function renderStreakBar() {
    const bar = el("div", "streak-bar");
    const main = el("div", "streak-main");
    main.appendChild(el("span", "streak-fire", state.streak > 0 ? "🔥" : "✨"));
    main.appendChild(el("span", "streak-count", "السلسلة: " + state.streak));
    const best = el("span", "streak-best", "أفضل سلسلة: " + state.maxStreak);
    bar.appendChild(main);
    bar.appendChild(best);
    if (state.streak >= 3) bar.classList.add("streak-hot");
    return bar;
}

function showStreakMilestone(streak) {
    const messages = {
        3: ["🔥", "سلسلة ثلاثية!", "ممتاز، واصل التركيز!"],
        5: ["⚡", "5 إجابات صحيحة متتالية!", "أنت داخل منطقة التحدّي!"],
        7: ["🏆", "7 إجابات متتالية!", "أداء قوي جدًا… لا تكسر السلسلة!"],
        10: ["👑", "10 إجابات متتالية!", "سلسلة مذهلة! هل تصل إلى النهاية بلا خطأ؟"]
    };
    if (!messages[streak]) return;
    const old = document.querySelector(".milestone");
    if (old) old.remove();
    const box = el("div", "milestone");
    box.appendChild(el("span", "m-emoji", messages[streak][0]));
    box.appendChild(el("strong", null, messages[streak][1]));
    box.appendChild(el("span", null, messages[streak][2]));
    document.body.appendChild(box);
    requestAnimationFrame(() => box.classList.add("show"));

function renderQuestion() {
    $app.classList.remove("is-result");
    $app.innerHTML = "";

    const screen = el("section", "screen pop");

    const topbar = el("div", "quiz-topbar");
    topbar.appendChild(el("span", "brand-pill", '<span class="dot"></span>' + CONFIG.title));

    actions.appendChild(buildFontControls());

    const resetBtn = el("button", "icon-btn", "↺");
    resetBtn.type = "button";
    resetBtn.setAttribute("aria-label", CONFIG.texts.retakeButton);
    resetBtn.addEventListener("click", () => {
        if (window.confirm(CONFIG.texts.restartConfirm)) {
            clearProgress();
            state.index = 0; state.answers = []; state.locked = false;
            state.streak = 0; state.maxStreak = 0;
            renderStart(null);
        }
    });
    actions.appendChild(resetBtn);
    topbar.appendChild(actions);
    screen.appendChild(topbar);

    screen.appendChild(renderStreakBar());

    const progressCard = el("div", "card progress-card");
    const currentNum = state.index + 1;
    const percentDone = Math.round((currentNum / TOTAL) * 100);
    const phead = el("div", "progress-head");
    phead.appendChild(el("span", null, CONFIG.texts.questionWord + " " + currentNum + " " + CONFIG.texts.fromWord + " " + TOTAL));
    phead.appendChild(el("span", "pct", percentDone + "%"));
    progressCard.appendChild(phead);
    const track = el("div", "progress-track");
    const fill = el("div", "progress-fill");
    track.appendChild(fill); progressCard.appendChild(track); screen.appendChild(progressCard);
    requestAnimationFrame(() => { fill.style.width = percentDone + "%"; });

    const card = el("div", "card");
    const q = QUIZ[state.index];

    if (q.quote) {
        const quoteCard = el("div", "quote-card");
        quoteCard.appendChild(el("span", "quote-chip", "✦ " + CONFIG.texts.quoteChip + " ✦"));
        quoteCard.appendChild(buildFontPicker());
        const quoteText = el("p", "quote-text");
        quoteText.textContent = q.quote;
        quoteCard.appendChild(quoteText);
        card.appendChild(quoteCard);
    }

    const question = el("h2", "question-text");
    question.textContent = q.question;
    card.appendChild(question);

    const optionsWrap = el("div", "options");
    optionsWrap.setAttribute("role", "group");
    optionsWrap.setAttribute("aria-label", q.question);

    let selected = null;
    const feedback = el("div", "answer-feedback hidden");
    const already = state.answers[state.index];
    const nextWrap = el("div", "next-wrap");
    const nextBtn = el("button", "btn btn-primary next-btn");
    nextBtn.type = "button"; nextWrap.appendChild(nextBtn);

    const setSelected = (value) => {
        if (state.locked || feedback.dataset.confirmed === "true") return;
        selected = value;
        feedback.classList.add("hidden");
        feedback.classList.remove("correct", "wrong");
        [...optionsWrap.children].forEach((btn, i) => {
            btn.classList.toggle("selected", i === value);
            btn.classList.remove("feedback-correct", "feedback-wrong");
            btn.setAttribute("aria-pressed", i === value ? "true" : "false");
        });
        nextBtn.classList.add("ready");
        nextBtn.disabled = false;
        nextBtn.textContent = "تأكيد الإجابة ✓";
    };

    q.options.forEach((opt, i) => {
        const btn = el("button", "option");
        btn.type = "button";
        btn.setAttribute("aria-pressed", "false");
        const badge = el("span", "badge", OPTION_LABELS[i] || (i + 1));
        const text = el("span", "option-text"); text.textContent = opt;
        const tick = el("span", "tick", "✓");
        btn.appendChild(badge); btn.appendChild(text); btn.appendChild(tick);
        btn.addEventListener("click", () => setSelected(i));
        optionsWrap.appendChild(btn);
    });

    if (typeof already === "number") setSelected(already);

    card.appendChild(optionsWrap);
    card.appendChild(feedback);
    card.appendChild(nextWrap);

    const hint = el("div", "key-hint hidden", "يمكنك استخدام الأرقام 1–4 للاختيار، و Enter للتأكيد/الانتقال");
    if (window.matchMedia && window.matchMedia("(pointer: fine)").matches) hint.classList.remove("hidden");
    card.appendChild(hint);

    nextBtn.addEventListener("click", () => {
        if (selected === null || state.locked) return;

        if (feedback.dataset.confirmed !== "true") {
            const isCorrect = selected === q.correct;
            feedback.dataset.confirmed = "true";
            feedback.classList.remove("hidden");
            feedback.classList.add(isCorrect ? "correct" : "wrong");

            [...optionsWrap.children].forEach((btn, i) => {
                btn.classList.toggle("feedback-correct", i === q.correct);
                btn.classList.toggle("feedback-wrong", i === selected && i !== q.correct);
                if (i === q.correct) btn.classList.add("answer-correct-pop");
                if (i === selected && i !== q.correct) btn.classList.add("answer-wrong-shake");
            });

            if (isCorrect) {
                state.streak++;
                state.maxStreak = Math.max(state.maxStreak, state.streak);
                feedback.textContent = "✓ إجابتك صحيحة — سلسلة " + state.streak + " 🔥";
                AudioFX.success();
                if ([3,5,7,10].includes(state.streak)) showStreakMilestone(state.streak);
            } else {
                state.streak = 0;
                feedback.textContent = "✗ إجابتك خاطئة — الإجابة الصحيحة: " + OPTION_LABELS[q.correct] + " — " + q.options[q.correct];
                AudioFX.error();
            }

            state.answers[state.index] = selected;
            saveProgress(state);
            const bar = document.querySelector(".streak-bar");
            if (bar) {
                bar.replaceWith(renderStreakBar());
            }

            nextBtn.textContent = (state.index === TOTAL - 1) ? CONFIG.texts.lastButton + " ←" : CONFIG.texts.nextButton + " ←";
            return;
        }

        state.locked = true;
        nextBtn.disabled = true;
        saveProgress(state);

        setTimeout(() => {
            if (state.index < TOTAL - 1) {
                state.index++;
                state.locked = false;
                renderQuestion();
                window.scrollTo({ top: 0, behavior: "smooth" });
            } else {
                finishQuiz();
            }
        }, 320);
    });

    const keyHandler = (e) => {
        if (state.locked) return;
        const num = parseInt(e.key, 10);
        if (num >= 1 && num <= q.options.length && feedback.dataset.confirmed !== "true") {
            setSelected(num - 1);
        } else if (e.key === "Enter" && selected !== null) {
            nextBtn.click();
        }
    };

    document.removeEventListener("keydown", state._keyHandler || (() => {}));
    state._keyHandler = keyHandler;
    document.addEventListener("keydown", keyHandler);

    screen.appendChild(card);
    const adCode = getAdForQuestion(state.index);
    if (adCode) screen.appendChild(buildAdBlock(adCode));
    $app.appendChild(screen);

    applyFontScale();
    applyQuoteFont();
}

/* ################################################################
   النتيجة
   ################################################################ */

function calculateScore() {
    let score = 0;
    for (let i = 0; i < TOTAL; i++) if (state.answers[i] === QUIZ[i].correct) score++;
    return score;
}

function finishQuiz() {
    const score = calculateScore();
    const wrong = TOTAL - score;
    const percent = Math.round((score / TOTAL) * 100);
    clearProgress();
    saveBest(score, TOTAL, percent);
    renderResult(score, wrong, percent);
}

function getMessage(percent) {
    const sorted = CONFIG.resultMessages.slice().sort((a, b) => b.min - a.min);
    return sorted.find(m => percent >= m.min) || sorted[sorted.length - 1];
}

function ringColor(percent) {
    if (percent >= 90) return "#059669";
    if (percent >= 70) return "#4f46e5";
    if (percent >= 50) return "#f59e0b";
    return "#e11d48";
}

function buildReviewSection() {
    const wrap = el("div", "review-section hidden");

    const head = el("div", "review-head");
    head.appendChild(el("h3", null, CONFIG.texts.reviewTitle));
    wrap.appendChild(head);

    wrap.appendChild(buildFontPicker());

    QUIZ.forEach((q, i) => {
        const userAns = state.answers[i];
        const isAnswered = typeof userAns === "number";
        const isCorrect = isAnswered && userAns === q.correct;

        const item = el("div", "review-item " + (isCorrect ? "correct" : "wrong"));

        const qhead = el("div", "review-q-head");
        qhead.appendChild(el("span", null, CONFIG.texts.questionWord + " " + (i + 1)));

        const statusText = !isAnswered
            ? "✕ " + CONFIG.texts.unansweredLabel
            : isCorrect ? "✓ " + CONFIG.texts.correctStatusLabel : "✕ " + CONFIG.texts.wrongStatusLabel;

        qhead.appendChild(el("span", "review-status " + (isCorrect ? "ok" : "bad"), statusText));
        item.appendChild(qhead);

        if (q.quote) {
            const quoteText = el("p", "review-quote-text");
            quoteText.textContent = q.quote;
            item.appendChild(quoteText);
        }

        const qText = el("div", "review-question-text");
        qText.textContent = q.question;
        item.appendChild(qText);

        const optsWrap = el("div", "review-options");

        q.options.forEach((opt, oi) => {
            let cls = "review-option";
            if (oi === q.correct) cls += " correct-answer";
            else if (isAnswered && oi === userAns) cls += " user-wrong";

            const optEl = el("div", cls);
            const label = OPTION_LABELS[oi] || (oi + 1);

            let tag = "";
            if (oi === q.correct) tag = " — ✓ " + CONFIG.texts.correctAnswerLabel;
            else if (isAnswered && oi === userAns) tag = " — ✕ " + CONFIG.texts.yourAnswerLabel;

            optEl.textContent = label + ". " + opt + tag;
            optsWrap.appendChild(optEl);
        });

        item.appendChild(optsWrap);
        wrap.appendChild(item);
    });

    return wrap;
}

function renderResult(score, wrong, percent) {
    $app.classList.add("is-result");
    $app.innerHTML = "";

    const screen = el("section", "screen pop result-layout");
    const main = el("div", "card result-hero");

    const fsRow = el("div", "fs-row");
    fsRow.appendChild(buildFontControls());
    main.appendChild(fsRow);

    main.appendChild(el("div", "result-emoji", percent >= 50 ? "🎉" : "📚"));
    main.appendChild(el("h1", "result-title", CONFIG.texts.resultTitle));

    const ringWrap = el("div", "score-ring-wrap");
    ringWrap.innerHTML =
        '<svg viewBox="0 0 160 160" aria-hidden="true">' +
        '<circle class="ring-bg" cx="80" cy="80" r="70"></circle>' +
        '<circle class="ring-fg" cx="80" cy="80" r="70"></circle>' +
        "</svg>";

    const ringCenter = el("div", "ring-center");
    ringCenter.appendChild(el("div", "ring-pct", percent + "%"));
    ringCenter.appendChild(el("div", "ring-pct-sub", CONFIG.texts.percentWord));
    ringWrap.appendChild(ringCenter);
    main.appendChild(ringWrap);

    const fg = ringWrap.querySelector(".ring-fg");
    fg.style.stroke = ringColor(percent);
    const circumference = 2 * Math.PI * 70;
    requestAnimationFrame(() => {
        fg.style.strokeDashoffset = circumference - (percent / 100) * circumference;
    });

    const scoreLine = el("div", "score-line");
    scoreLine.appendChild(el("span", null, CONFIG.texts.yourScore + ": "));
    scoreLine.appendChild(el("span", null, String(score)));
    scoreLine.appendChild(el("span", "den", " / " + TOTAL));
    main.appendChild(scoreLine);

    const msg = getMessage(percent);
    main.appendChild(el("div", "result-msg " + msg.level, msg.text));

    const compareMap = { score, total: TOTAL, percent, title: CONFIG.title };
    if (CONFIG.compareText) main.appendChild(el("p", "compare-text", tpl(CONFIG.compareText, compareMap)));

    const stats = el("div", "stats-row");
    const st1 = el("div", "stat ok");
    st1.appendChild(el("div", "num", String(score)));
    st1.appendChild(el("div", "lbl", CONFIG.texts.correctWord));
    const st2 = el("div", "stat bad");
    st2.appendChild(el("div", "num", String(wrong)));
    st2.appendChild(el("div", "lbl", CONFIG.texts.wrongWord));
    const st3 = el("div", "stat pct");
    st3.appendChild(el("div", "num", percent + "%"));
    st3.appendChild(el("div", "lbl", CONFIG.texts.percentWord));
    stats.appendChild(st1); stats.appendChild(st2); stats.appendChild(st3);
    main.appendChild(stats);

    const shareBody = tpl(CONFIG.shareText, compareMap);
    const pageUrl = window.location.href;
    const encShare = encodeURIComponent(shareBody);
    const encUrl = encodeURIComponent(pageUrl);

    const actions = el("div", "btn-stack");

    const shareBtn = el("button", "btn btn-primary", CONFIG.texts.shareButton);
    shareBtn.type = "button";

    const shareMenu = el("div", "share-menu hidden");

    const wa = el("a", "btn btn-whatsapp", "💬 " + CONFIG.texts.shareWhatsApp);
    wa.href = "https://wa.me/?text=" + encShare + "%20" + encUrl;
    wa.target = "_blank"; wa.rel = "noopener noreferrer";

    const tg = el("a", "btn btn-telegram", "✈️ " + CONFIG.texts.shareTelegram);
    tg.href = "https://t.me/share/url?url=" + encUrl + "&text=" + encShare;
    tg.target = "_blank"; tg.rel = "noopener noreferrer";

    const copy = el("button", "btn btn-ghost", "📋 " + CONFIG.texts.shareCopy);
    copy.type = "button";
    copy.addEventListener("click", () => copyText(shareBody + " " + pageUrl));

    shareMenu.appendChild(wa);
    shareMenu.appendChild(tg);

    if (navigator.share) {
        const native = el("button", "btn btn-outline", "🔗 " + CONFIG.texts.shareNative);
        native.type = "button";
        native.addEventListener("click", () => {
            navigator.share({ title: CONFIG.title, text: shareBody, url: pageUrl }).catch(() => {});
        });
        shareMenu.appendChild(native);
    }

    shareMenu.appendChild(copy);
    shareBtn.addEventListener("click", () => shareMenu.classList.toggle("hidden"));

    actions.appendChild(shareBtn);
    actions.appendChild(shareMenu);

    /* زر مراجعة الإجابات */
    const reviewBtn = el("button", "btn btn-outline", CONFIG.texts.reviewButton);
    reviewBtn.type = "button";
    const reviewSection = buildReviewSection();

    reviewBtn.addEventListener("click", () => {
        const willShow = reviewSection.classList.contains("hidden");
        reviewSection.classList.toggle("hidden");
        reviewBtn.textContent = willShow ? CONFIG.texts.closeReviewButton : CONFIG.texts.reviewButton;
        if (willShow) {
            applyQuoteFont();
            reviewSection.scrollIntoView({ behavior: "smooth", block: "start" });
        }
    });
    actions.appendChild(reviewBtn);

    const row1 = el("div", "btn-row");

    const retake = el("button", "btn btn-success", CONFIG.texts.retakeButton);
    retake.type = "button";
    retake.addEventListener("click", () => {
        state.index = 0; state.answers = []; state.locked = false;
        clearProgress();
        renderStart(null);
        AudioFX.success();
    window.scrollTo({ top: 0, behavior: "smooth" });
    });
    row1.appendChild(retake);

    if (CONFIG.secondTestUrl && CONFIG.secondTestUrl.trim()) {
        const second = el("a", "btn btn-outline", CONFIG.texts.secondTestButton);
        second.href = CONFIG.secondTestUrl;
        second.target = "_blank"; second.rel = "noopener noreferrer";
        row1.appendChild(second);
    }
    actions.appendChild(row1);

    if (CONFIG.telegramUrl && CONFIG.telegramUrl.trim()) {
        const tgJoin = el("a", "btn btn-telegram", CONFIG.texts.telegramButton);
        tgJoin.href = CONFIG.telegramUrl;
        tgJoin.target = "_blank"; tgJoin.rel = "noopener noreferrer";
        actions.appendChild(tgJoin);
    }

    main.appendChild(actions);
    main.appendChild(reviewSection);

    const footer = el("div", "result-footer");
    footer.appendChild(el("div", null, "<strong>" + CONFIG.texts.testLinkTitle + "</strong>"));

    const linkRow = el("div", "link-row");
    const linkInput = document.createElement("input");
    linkInput.type = "text"; linkInput.readOnly = true; linkInput.value = pageUrl;
    linkInput.setAttribute("aria-label", CONFIG.texts.testLinkTitle);

    const copyLinkBtn = el("button", "copy-btn", CONFIG.texts.copyLinkButton);
    copyLinkBtn.type = "button";
    copyLinkBtn.addEventListener("click", () => {
        copyText(pageUrl);
        copyLinkBtn.textContent = "✓";
        copyLinkBtn.classList.add("copied");
        setTimeout(() => {
            copyLinkBtn.textContent = CONFIG.texts.copyLinkButton;
            copyLinkBtn.classList.remove("copied");
        }, 1800);
    });

    linkRow.appendChild(linkInput);
    linkRow.appendChild(copyLinkBtn);
    footer.appendChild(linkRow);

    if (CONFIG.telegramUrl && CONFIG.telegramUrl.trim()) {
        const links = el("div", "footer-links");
        const tgFooter = el("a", "btn btn-ghost", CONFIG.texts.telegramFooter);
        tgFooter.href = CONFIG.telegramUrl;
        tgFooter.target = "_blank"; tgFooter.rel = "noopener noreferrer";
        links.appendChild(tgFooter);
        footer.appendChild(links);
    }

    main.appendChild(footer);
    screen.appendChild(main);

    if (RESULT_AD && RESULT_AD.trim()) {
        const aside = el("aside", "result-aside");
        aside.appendChild(el("span", "ad-label", "— " + CONFIG.texts.adLabel + " —"));
        const slot = el("div", "ad-slot");
        slot.style.flexDirection = "column";
        aside.appendChild(slot);
        if (CONFIG.texts.adDisclaimer && CONFIG.texts.adDisclaimer.trim()) {
            aside.appendChild(el("span", "ad-disclaimer", CONFIG.texts.adDisclaimer));
        }
        screen.appendChild(aside);
        setTimeout(() => mountAd(slot, RESULT_AD), 120);
    }

    $app.appendChild(screen);

    applyFontScale();
    applyQuoteFont();

    AudioFX.success();
    window.scrollTo({ top: 0, behavior: "smooth" });
}


/* مؤثرات صوتية احترافية عبر Web Audio API — لا تحتاج ملفات خارجية */
const AudioFX = (() => { let ctx; const get=()=>ctx||(ctx=new (window.AudioContext||window.webkitAudioContext)());
function tone(freq,dur,type="sine",vol=.045){try{const c=get(),o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(.0001,c.currentTime);g.gain.exponentialRampToValueAtTime(vol,c.currentTime+.01);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+dur);o.connect(g).connect(c.destination);o.start();o.stop(c.currentTime+dur+.03)}catch(e){}}
return {click:()=>tone(520,.07,"sine",.035),select:()=>{tone(660,.08);setTimeout(()=>tone(880,.1),55)},success:()=>{tone(523,.12);setTimeout(()=>tone(659,.12),100);setTimeout(()=>tone(784,.2),200)},error:()=>tone(180,.16,"triangle",.04)};})();
document.addEventListener("click",e=>{const t=e.target.closest("button");if(!t)return;if(t.classList.contains("option"))AudioFX.select();else AudioFX.click();},{passive:true});
const _oldRenderResult = typeof renderResult === "function" ? renderResult : null;

/* ################################################################
   شاشة الخطأ
   ################################################################ */

function renderError(errors) {
    $app.classList.remove("is-result");
    $app.innerHTML = "";
    const screen = el("section", "screen");
    const card = el("div", "card error-card");
    card.appendChild(el("div", "big", "⚠️"));
    card.appendChild(el("h1", null, "توجد مشكلة في إعداد الأسئلة"));
    card.appendChild(el("p", null, "راجع مصفوفة QUESTIONS في أعلى الملف وأصلح الأخطاء التالية:"));
    card.appendChild(el("code", null, errors.join("\n")));
    screen.appendChild(card);
    $app.appendChild(screen);
}

/* ################################################################
   الإقلاع
   ################################################################ */

(function init() {
    document.title = CONFIG.title + " — " + CONFIG.subtitle;

    const metaDesc = document.querySelector('meta[name="description"]');
    if (metaDesc) metaDesc.setAttribute("content", CONFIG.description || CONFIG.subtitle);

    loadFontScale();
    applyFontScale();

    loadQuoteFont();
    applyQuoteFont();

    if (!validation.valid) {
        renderError(validation.errors);
        return;
    }

    document.removeEventListener("keydown", state._keyHandler || (() => {}));
    renderStart(loadProgress());
})();

}
</script>
